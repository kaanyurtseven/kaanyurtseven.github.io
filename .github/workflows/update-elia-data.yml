name: Fetch Elia Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Fetch Elia data
        run: ruby scripts/fetch_elia_data.rb

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/wind_acc.json \
                  assets/data/solar_acc.json \
                  assets/data/wind_recent_acc.json \
                  assets/data/solar_recent_acc.json \
                  assets/data/wind.json \
                  assets/data/solar.json
          git diff --cached --quiet || git commit -m "chore: refresh Elia forecast data ($(date -u '+%Y-%m-%dT%H:%M'))"
          git push
