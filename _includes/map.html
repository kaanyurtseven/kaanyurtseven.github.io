<section class="map-section" id="research-footprint" aria-labelledby="map-heading">
  <div class="map-section__header">
    <p class="map-section__eyebrow">Research Impact</p>
    <h2 class="map-section__title" id="map-heading">Global Footprint of My Research</h2>
    <p class="map-section__subtitle">
      Education, conference papers, talks, field visits, training, and awards connected to this research.
    </p>
  </div>

  <!-- Duotone basemap filter. Esri's Light Gray Canvas draws water with a slight
       blue bias (B - R ~ 4/255) and everything else in neutral gray. Steps 1-2 turn
       that bias into complementary water/land masks, step 3 takes luminance, steps
       4-5 build a blue-tinted and a cream-tinted copy from it, steps 6-8 mix the two
       by the masks. Applied through .leaflet-layer.basemap-duotone in main.css; the
       class is set on the base layer in map.js (TILE_PROVIDERS). -->
  <svg width="0" height="0" aria-hidden="true" focusable="false"
       style="position:absolute;width:0;height:0;overflow:hidden">
    <filter id="map-duotone" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="matrix" result="water-mask"
        values="-100 0 100 0 -0.3  -100 0 100 0 -0.3  -100 0 100 0 -0.3  0 0 0 1 0"/>
      <feColorMatrix in="SourceGraphic" type="matrix" result="land-mask"
        values="100 0 -100 0 1.3  100 0 -100 0 1.3  100 0 -100 0 1.3  0 0 0 1 0"/>
      <feColorMatrix in="SourceGraphic" type="matrix" result="lum"
        values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
      <feComponentTransfer in="lum" result="water">
        <feFuncR type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.680 0.730 0.800 0.870 0.930 1.000"/>
        <feFuncG type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.800 0.840 0.880 0.920 0.960 1.000"/>
        <feFuncB type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.880 0.910 0.930 0.950 0.980 1.000"/>
      </feComponentTransfer>
      <feComponentTransfer in="lum" result="land">
        <feFuncR type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.750 0.800 0.850 0.950 0.970 1.000"/>
        <feFuncG type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.750 0.800 0.850 0.940 0.965 1.000"/>
        <feFuncB type="table" tableValues="0.000 0.050 0.100 0.150 0.200 0.250 0.300 0.350 0.400 0.450 0.500 0.550 0.600 0.650 0.700 0.750 0.800 0.850 0.910 0.945 1.000"/>
      </feComponentTransfer>
      <feComposite in="water" in2="water-mask" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="water-part"/>
      <feComposite in="land" in2="land-mask" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="land-part"/>
      <feComposite in="water-part" in2="land-part" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
  </svg>

  <div class="map-wrap">
    <div class="map-container" id="research-map"
         role="application" aria-label="Interactive map of research contributions">
    </div>

    <!-- Hover preview (desktop only, positioned by JS) -->
    <div class="map-preview" id="map-preview" hidden aria-hidden="true">
      <span class="map-preview__type" id="mp-type"></span>
      <p class="map-preview__label" id="mp-label"></p>
      <p class="map-preview__summary" id="mp-summary"></p>
      <span class="map-preview__photo" id="mp-photo" hidden>photo</span>
    </div>

    <!-- Detail panel (slides in from right on desktop, bottom sheet on mobile) -->
    <div class="map-detail" id="map-detail" hidden>
      <button class="map-detail__close" id="map-detail-close" aria-label="Close detail panel">&times;</button>
      <div class="map-detail__inner">
        <div class="map-detail__head">
          <span class="map-detail__badge" id="md-type"></span>
          <span class="map-detail__year" id="md-year"></span>
        </div>
        <h3 class="map-detail__label" id="md-label"></h3>
        <p class="map-detail__location" id="md-location"></p>
        <p class="map-detail__venue" id="md-venue"></p>
        <p class="map-detail__paper" id="md-paper"></p>
        <p class="map-detail__desc" id="md-desc"></p>
        <img class="map-detail__image" id="md-image" src="" alt="" hidden>
        <div class="map-detail__tags" id="md-tags"></div>
        <div class="map-detail__actions" id="md-actions"></div>
      </div>
    </div>

    <!-- Scroll interaction hint -->
    <div class="map-hint" id="map-hint">
      <span>Click the map to interact</span>
    </div>

    <div class="map-legend" aria-label="Pin category legend">
      <span class="map-legend__item map-legend__item--award">Award</span>
      <span class="map-legend__item map-legend__item--publication">Conference</span>
      <span class="map-legend__item map-legend__item--training">Training</span>
      <span class="map-legend__item map-legend__item--talk">Talk / Poster</span>
      <span class="map-legend__item map-legend__item--visit">Visit</span>
      <span class="map-legend__item map-legend__item--education">Education</span>
      <span class="map-legend__item map-legend__item--home">Research Base</span>
      <span class="map-legend__hint">— click any pin for details</span>
    </div>
  </div>
</section>

<script>
window.MAP_PINS = {{ site.data.map_pins | jsonify }};
</script>
