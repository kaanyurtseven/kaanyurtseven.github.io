- title: "Hybrid offshore solar-wind farms: the potential of integrating floating photovoltaics with offshore wind"
  authors: "O. Delbeke, G. Bastianel, K. Yurtseven, H. Ergun, J. Moschner, J. Driesen"
  year: 2026
  type: journal
  venue: "Applied Energy"
  doi: "10.1016/j.apenergy.2026.127486"
  tags: [Floating PV, Hybrid Power Plant, Offshore Floating PV, Offshore Wind, Stochastic Generation Expansion Planning, Wake Effect]
  featured: false
  abstract: "Floating photovoltaics (PV) are rapidly scaling up solar power beyond on-land PV. Whilst offshore floating PV (OFPV) is still in pilot phase, its combination with offshore wind could enable an efficient common use of costly transmission infrastructure. This work presents a detailed, quantitative case study assessing the integration of offshore floating PV with offshore wind. Through stochastic generation expansion planning, the optimal distribution of OFPV within a representative Dutch offshore wind farm is determined. In the power collection network, OFPV is best connected to the substation, or to the wind turbines electrically nearest to it. To evaluate the economic performance of the hybrid solar-wind system, its electrical integration with the Central Western European grid is simulated. The study reveals that a considerable amount of OFPV can be integrated in a modern offshore wind farm without hindering the transmission of wind power, with the export cables being the main bottleneck in power transfer, followed by the substation transformers and the array cables. However, this is accompanied by a significant amount of OFPV curtailment. As the capacity factors of offshore wind turbines increase, the remaining transmission gap in their connections, which OFPV can utilise without any transmission expansion, narrows. Finally, cost targets are derived for which the integrated offshore solar system would break even in the analysed case, revealing challenging economic prospects. The work identifies opportunities for hybrid offshore solar-wind farms and highlights key technical and economic challenges to be addressed."

- title: "Congestion Management Through Stochastic Optimal Transmission Switching in Hybrid AC/DC Grids Considering Continuous Non-Gaussian Uncertainty"
  authors: "K. Yurtseven, A. Koirala, H. Ergun, D. Van Hertem"
  year: 2025
  type: journal
  venue: "IEEE Transactions on Power Systems"
  doi: "10.1109/TPWRS.2025.3648549"
  tags: [Stochastic Optimal Transmission Switching, Chance-Constrained Optimization, Polynomial Chaos Expansion, HVDC, Stochastic Programming]
  featured: true
  abstract: "The integration of renewable energy sources (RES) in power systems introduces significant uncertainty. As this uncertainty increases, transmission system operators maintain higher operational margins to ensure reliable operation. This limits the available transmission capacity and contributes to grid congestion. As a result, the system operator relies more on costly remedial actions such as generation redispatch and RES curtailment. This paper presents a chance-constrained congestion management model to minimize expected RES curtailment and generation cost in hybrid AC/DC grids. The model is based on a tractable Stochastic Optimal Transmission Switching (SOTS) formulation that optimizes the switching state of AC and DC transmission lines, RES curtailment, HVDC converter set-points, and generator dispatch. It captures continuous non-Gaussian uncertainty in RES forecast errors using Polynomial Chaos Expansion. The tractability of the model is further improved using relaxation of binary variables. Three case studies are conducted. First, the proposed model is compared against a stochastic optimal power flow and a MINLP SOTS model using a 5-bus AC/DC test system. Second, the impact of binary relaxation parameter and solver tolerance on the output probability distributions is analyzed using a 67-bus AC/DC test system. Third, scalability is demonstrated on a 588-bus AC/DC test system under different RES penetration levels and switching configurations. The results show that the model substantially reduces RES curtailment and operational costs. Moreover, it is at least an order of magnitude faster than the MINLP formulation while maintaining accuracy in the output distributions, and it remains tractable for large systems."

- title: "Stochastic optimal power flow for hybrid AC/DC grids considering continuous non-Gaussian uncertainty"
  authors: "K. Yurtseven, A. Koirala, H. Ergun, D. Van Hertem"
  year: 2025
  type: journal
  venue: "International Journal of Electrical Power & Energy Systems"
  doi: "10.1016/j.ijepes.2025.110828"
  tags: [Stochastic Optimal Power Flow, HVDC, Polynomial Chaos Expansion, Continuous Non-Gaussian Uncertainty, RES Curtailment]
  featured: true
  abstract: "The integration of renewable energy sources (RES) and the increasing adoption of High Voltage Direct Current (HVDC) transmission are reshaping modern power systems. Whereas RES introduce complex uncertainties in power system operation, often contributing to grid congestion, HVDC technology provides flexibility for effective congestion management. Accurately leveraging this flexibility through optimal scheduling of HVDC converters and minimizing expected RES curtailment requires optimization frameworks that simultaneously account for (i) continuous non-Gaussian uncertainty, (ii) hybrid AC/DC grid compatibility, and (iii) RES curtailment. However, existing Stochastic Optimal Power Flow (SOPF) models do not combine all three dimensions because their interaction significantly increases the nonlinearity. To bridge this gap, this paper introduces a Polynomial Chaos Expansion based chance-constrained SOPF framework that integrates these three dimensions within a single model, paving the way for reliable and cost-efficient hybrid AC/DC grid operation under high RES penetration. The effectiveness of the proposed framework is demonstrated through four case studies on 5-bus, 67-bus, 118-bus, and 588-bus hybrid AC/DC test systems. Results show that by accurately capturing interactions between input uncertainty, HVDC converter set-points, and RES curtailment, the proposed framework minimizes expected RES curtailment and operational costs, leading to significant financial savings under high RES penetration. In addition, the framework is shown to maintain computational scalability on large-scale systems while preserving modeling accuracy under continuous non-Gaussian uncertainty."

- title: "Influence of Inherent Characteristic of PV Plants in Risk-Based Stochastic Dynamic Substation Expansion Planning Under MILP Framework"
  authors: "K. Yurtseven, E. Karatepe"
  year: 2022
  type: journal
  venue: "IEEE Transactions on Power Systems"
  doi: "10.1109/TPWRS.2021.3095266"
  tags: [Correlation, Dynamic Planning, Mixed-Integer Linear Programming, Photovoltaic, Stochastic Programming, Substation Expansion Planning]
  featured: true
  abstract: "A suitable probabilistic scenario set of load demand and natural characteristics of renewable energy is becoming a crucial issue in power system planning studies. Properly addressing the impact of potentially thousands of residential PV plants on the resilience and reliability needs of substations necessitates the representation of inherent relations between photovoltaics and the load throughout the long-term planning period. The optimal planning of substation expansions is achievable through proper modeling of input parameters which describes the characteristics of the service areas. In this paper, the co-existence of PV plants and the load in a service area under three different states such as daytime with clear-sky and no-fault, daytime with abnormal events, and nighttime are incorporated into the stochastic dynamic optimization problem by using scenario-based approach. The scenario tree of the problem is branched from three different bases simultaneously instead of only one as in conventional approach. This paper also combines the risk-constrained stochastic dynamic SEP problem and Mixed Integer Linear Programming (MILP) framework under one roof. The comparison between integrating inherent characteristics of PV plants with and without considering abnormal events into the optimization is performed to show the impact of suitable probabilistic model on dynamic nature of investment decisions."

- title: "Sensorless fault detection method for photovoltaic systems through mapping the inherent characteristics of PV plant site: Simple and practical"
  authors: "K. Yurtseven, E. Karatepe, E. Deniz"
  year: 2021
  type: journal
  venue: "Solar Energy"
  doi: "10.1016/j.solener.2021.01.011"
  tags: [Photovoltaic (PV) Systems, Fault Detection, Sensorless, Cloudy-sky, Operation and Maintenance (O&M), Practical Implementation]
  featured: false
  abstract: "Research on monitoring and fault detection systems for photovoltaic plants is significantly increasing with the continual development in technologies and the availability of qualified data. Nevertheless, many gaps still exist that need to be addressed. The electrical output of PV plants in various weather conditions is very close to those obtained under fault conditions. For a large scale PV plant, it is very crucial to utilize the data in the decision-making process without using external sensors or performing simulation studies that require detailed parameters of the plant. The main challenge here is to automatically rationalize the collected data in order to make a decision on distinguishing between faulty and natural outputs. This paper proposes a method for distinguishing faults and inherent changes in the PV plant’s output to help O&M crews identify and fix system issues. The proposed method has the ability to map the inherent characteristics of the PV plant by using only the data received from inverters without using additional equipment or detailed models. It has been developed by analyzing the working mechanisms of several large scale PV plants installed in Turkey. The proposed method can easily be implemented in a newly installed or existing PV plant. The novelty of this study is detecting abnormal operations in a PV plant even under low irradiance and cloudy-sky conditions without using any irradiance and temperature sensors. The effectiveness of the proposed method is shown in rooftop and ground-mounted PV plants."

