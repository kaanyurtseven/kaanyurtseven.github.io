- title: "Security-Constrained Stochastic Optimal Power Flow For Hybrid AC/DC Grids Considering Non-Gaussian Uncertainty"
  authors: "K. Yurtseven, H. Ergun, D. Van Hertem"
  year: 2025
  type: conference
  venue: "IEEE Kiel PowerTech 2025"
  doi: "10.1109/PowerTech59965.2025.11180443"
  tags: [Security-Constrained Optimal Power Flow, Chance-Constrained Optimization, Preventive-Corrective Actions, HVDC Flexibility, Continuous Non-Gaussian Uncertainty]
  featured: false
  abstract: "The integration of renewable energy sources (RES) introduces uncertainty into power systems, which contributes to grid congestion by necessitating higher operational margins. System operators manage congestion in real-time through costly remedial actions, such as generation redispatch and RES curtailment, or alternatively, by leveraging non-costly transmission grid flexibility. Even though effective use of this flexibility can minimize the dependence on costly actions, it requires congestion management strategies supported by models that accurately represent uncertainty while ensuring the system remains N-1 secure. To overcome this challenge, this paper proposes a Security-Constrained Stochastic Optimal Power Flow model based on Polynomial Chaos Expansion. This chance-constrained model minimizes the expected redispatch costs and RES curtailment by utilizing HVDC transmission flexibility in hybrid AC/DC grids. The model enables system operators to optimize the HVDC converter set-points, RES curtailment, and generator redispatch while accounting for continuous non-Gaussian uncertainty in RES forecast errors to ensure a realistic representation of uncertainty. Two case studies are presented on a 5-bus AC/DC test system. The first case investigates the impact of HVDC flexibility on redispatch costs and RES curtailment, analyzing preventive and corrective actions for topological uncertainties, as well as here-and-now and wait-and-see decisions for operational uncertainties. The second case highlights the limitations of assuming Gaussian input uncertainty by benchmarking it against the proposed model."

- title: "Risk-based Stochastic Optimal Power Flow for AC/DC Grids Using Polynomial Chaos Expansion"
  authors: "K. Yurtseven, H. Ergun, D. Van Hertem"
  year: 2024
  type: conference
  venue: "IEEE ISGT EUROPE 2024"
  doi: "10.1109/ISGTEUROPE62998.2024.10863605"
  tags: [Stochastic Optimal Power Flow, Chance-Constrained Optimization, Risk-Averse Optimization, Polynomial Chaos Expansion, HVDC]
  featured: false
  abstract: "Renewable energy sources (RES) are increasingly integrated into power systems, introducing operational uncertainties that challenge the way we manage the grid. These uncertainties necessitate strategies to address the risks in grid reliability and economic performance. This paper introduces a framework to simultaneously manage the risk associated with economic performance and grid reliability under non-Gaussian uncertainty. The framework utilizes Polynomial Chaos Expansion to solve the risk-based and chance-constrained Stochastic Optimal Power Flow for hybrid AC/DC grids. The risk associated with the costs is addressed by introducing the Value-at-Risk parameter, derived through moment-based calculations, to facilitate risk-averse decision-making. Numerical studies illustrate the impact of risk-neutral versus risk-averse decision-making on the probability distribution functions of RES curtailment and operational costs. Additionally, analyzing efficient frontiers for various confidence levels showcases the framework’s capability to construct a portfolio of strategies that effectively balance risk and operational costs under varying confidence levels of non-Gaussian uncertainty."

- title: "Robust and Security-Constrained Optimisation of Converter Droop Gains in Meshed HVDC Grids"
  authors: "H. Ergun, K. Yurtseven, G. Mohy-ud-din, R. Heidari"
  year: 2024
  type: conference
  venue: "18th International Conference on Probabilistic Methods Applied to Power Systems (PMAPS)"
  doi: "10.1109/PMAPS61648.2024.10667176"
  tags: [HVDC Grids, Droop Control, Security-Constrained Optimal Power Flow]
  featured: false
  abstract: "In this paper we are presenting a preventive security constrained optimal power flow model for AC/DC grids using a robust optimisation of converter active power-voltage droop coefficients and generators and HVDC converters active and reactive power set points. The converters’ optimal droop control actions maintain system feasibility after DC grid contingencies. The model takes into account wind power and load demand uncertainties and uses a scenario based approach to robustly determine the HVDC converters’ voltage-power droop coefficients. The developed optimisation model is applied to a variety of AC/DC grid test cases for the analysis of its computational performance, convergence and AC feasibility of the obtained solution. Finally, we propose a number of future extensions and modelling improvements for real-life applicability of the developed model in the day-ahead operational time frame."

- title: "A bi-objective approach to power system restoration with renewable participation"
  authors: "H. Çalık, H. Ergun, K. Yurtseven, D. Van Hertem"
  year: 2024
  type: conference
  venue: "18th International Conference on Probabilistic Methods Applied to Power Systems (PMAPS)"
  doi: "10.1109/PMAPS61648.2024.10667142"
  tags: [Renewable Energy Sources, Uncertainty, Decision Making, Power System Restoration]
  featured: false
  abstract: "Unprecedented events may cause power system failures and blackouts whose impact may be highly destructive. It is therefore of extreme importance to design and operate power systems that ensure high resilience and efficient restoration plans in case of blackouts. While renewable energy sources (RES) are invaluable assets for a sustainable future, the uncertainty present in RES-dominated systems poses a challenge in developing optimal restoration strategies. We address this challenge in determining optimal generator start-up sequences through a novel mathematical formulation and solution methodology that incorporate the uncertainty in renewable participation by means of chance constraints. The novel formulation outperforms the state-of-the-art formulation for solving the deterministic problem for medium- and large-scale instances as well as provides the optimal restoration time in a matter of seconds on a medium-scale network for the stochastic problem. We further provide insightful observations with respect to renewable contribution under different confidence levels and optimization objectives."

- title: "Data-Driven Assessment of Soiling Loss in Photovoltaic Plants"
  authors: "K. Yurtseven, E. Karatepe, E. Deniz"
  year: 2021
  type: conference
  venue: "EU PVSEC 2021 38th European Photovoltaic Solar Energy Conference and Exhibiton"
  doi: "10.4229/EUPVSEC20212021-5DO.4.3"
  tags: [PV System, Shading, System Performance, Soiling Losses, Operation and Maintenance]
  featured: false
  abstract: "Utilizing reliable monitoring and available data in order to ensure that the PV plants become best-return-on investments is possible thanks to ever going developments in data-driven algorithms. One of the major challenges in PV power generation is the soiling events caused by the dusty environments and climatic conditions resulting in the reduction of the performance of the PV plants. Since the soiling is a complex event whose characteristics are forged by a number of external stochastic phenomena, a number of studies are conducted by researchers. Soiling in PV plants is a continuous subject that emerges over time as an important drawback in the performance of the PV plants. In that point, it is crucial to automatically determine appropriate cleaning schedules in order to achieve a high-profit PV plant operation. In this study, a method is presented which only uses the DC current inputs of the inverters to determine the soiling loss without using any environmental sensors. The proposed method is tested by conducting experimental works on three different PV plants which are connected to the power grid in Turkey. The results show that the proposed method is effective for analyzing the performance reductions due to soiling in the PV plants without using any environmental sensors"

- title: "Distribution Substation Expansion Planning Considering Different Geographical Configurations"
  authors: "K. Yurtseven, E. Karatepe"
  year: 2021
  type: conference
  venue: "12th International Symposium on Advanced Topics in Electrical Engineering (ATEE)"
  doi: "10.1109/ATEE52255.2021.9425221"
  tags: [Substation Expansion Planning, Mixed-Integer Linear Programming, Geographical Configuration, Approximate Lumped Model, Voltage Profile, Power Loss]
  featured: false
  abstract: "Making decisions on expansions of the power system as a result of the growth in electricity demand is essential in order to maintain a reliable network. Since substations take on the role of the intermediate link between electricity supply and demand, substation expansion planning (SEP) is one of the most important planning studies. In this study, the SEP problem is merged with the different geographical configurations of the zones within a mixed integer linear programming framework. The voltage profile and power losses are integrated into the SEP problem by using approximate lumped model of the zones. The effect of voltage constraints and the cost of feeder loss on the SEP problem is investigated and the comparison between the SEP problem with rectangular zones and with triangular zones is performed to show the impact of different geographical configurations on the investment decisions."

