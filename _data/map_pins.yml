# ============================================================
# Research Footprint Map: pin data
# ============================================================
# id:            stable slug (used by news.yml `pin:` and publications.yml `pin:`)
# type:          home | education | publication | talk | training | visit | data | award
# lat/lng:       decimal degrees (positive = North / East)
# label:         event or institution name
# city, country
# year:          string, e.g. "2025" or "2025, 2026"
# description:   1-2 sentences (use | to keep line breaks)
# virtual:       true for events held online (optional; the glyph gets data-virtual). Every pin but
#                `home` has an arc from the research base, held online or not.
# paper_title / paper_doi / venue   (optional)
# papers:        [{doi, label}] one link per paper when a pin has several (optional; DOIs from publications.yml)
# news:          id of the matching news.yml entry (optional; adds a "Read the news entry" link)
# link:          external URL (optional)
# image / image_alt   photo shown in the detail panel at its natural aspect ratio (optional)
# ============================================================

