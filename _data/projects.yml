- name: "StochasticPowerModels.jl"
  description: "An extension of PowerModels.jl for stochastic power system optimization, developed as part of my research at KU Leuven. Implements stochastic optimal power flow for AC and hybrid AC/DC networks using Polynomial Chaos Expansion for continuous uncertainty propagation, with support for risk-based formulations and transmission switching optimization."
  language: "Julia"
  url: "https://github.com/Electa-Git/StochasticPowerModels.jl"
  status: "active"
  featured: true
