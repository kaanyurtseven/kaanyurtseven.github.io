# ============================================================
# Curriculum vitae: the CV page (_includes/pages/cv.html).
# Place names use Turkish orthography (Dokuz Eylül, İzmir).
# Dates: start/end are "YYYY" or "YYYY-MM" (end: null = present);
# `period` is the display string: a range of two bare years takes a closed en dash
# ("2020–2021"), a range beside a month or a word a spaced one ("Oct 2026 – present").
# Strings may carry {tokens} (_includes/pages/fill.html).
# ============================================================

title: "Curriculum Vitae"

# Words of the rows' detail lines: "Thesis <title>", "Supervisor X, co-supervisor Y.",
# "Defended on 15 October 2026.", 'Project "<name>"' (no colon after a label). The
# supervisor words also make the thesis line on Publications.
labels:
  thesis: "Thesis"
  supervisor: "Supervisor"
  co_supervisor: "co-supervisor"
  defended: "Defended on"
  project: "Project"
  pdf: "Download as PDF"        # the link under the h1 to profile.yml cv_pdf

profile:
  heading: "Professional profile"   # the text of the CV PDF's Professional Profile
  paragraphs:
    - >-
      My research focuses on one of the fundamental challenges in power systems, making decisions
      under uncertainty while keeping the grid secure and efficient. I combine advanced mathematics
      and AI to develop better approaches to power system operation and planning, making the costs
      and risks of different decisions explicit. What motivates me is not just developing new
      methods, but making them useful in practice. Ultimately, I want to see these methods move
      beyond academic research and into the control rooms where decisions are made.

