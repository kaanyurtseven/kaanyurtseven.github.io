# ============================================================
# Curriculum vitae: the CV page (_includes/pages/cv.html).
# Place names use Turkish orthography (Dokuz Eylül, İzmir).
# Dates: start/end are "YYYY" or "YYYY-MM" (end: null = present);
# `period` is the display string: a range of two bare years takes a closed en dash
# ("2020–2021"), a range beside a month or a word a spaced one ("Oct 2026 – present").
# Strings may carry {tokens} (_includes/pages/fill.html).
# ============================================================

title: "Curriculum Vitae"

# Words of the rows' detail lines: "Thesis <title>", "Supervisor X, co-supervisor Y.",
# "Defended on 15 October 2026.", 'Project "<name>"' (no colon after a label). The
# supervisor words also make the thesis line on Publications.
labels:
  thesis: "Thesis"
  supervisor: "Supervisor"
  co_supervisor: "co-supervisor"
  defended: "Defended on"
  project: "Project"
  pdf: "Download as PDF"        # the link under the h1 to profile.yml cv_pdf

profile:
  heading: "Professional profile"   # the text of the CV PDF's Professional Profile
  paragraphs:
    - >-
      I develop stochastic and risk-based optimization methods for one of the daily challenges of
      transmission system operators, managing congestion and keeping the grid secure when wind and
      solar forecasts are uncertain. These methods coordinate remedial actions such as redispatch,
      topological actions and power flow control, and make the costs and risks of each operational
      decision explicit. As an R&D engineer before my Ph.D., I developed models that turn large
      volumes of photovoltaic monitoring data into operational decisions, implemented across
      integrated systems in two countries. My goal is to build practical decision-support tools for
      grid operation that make a real difference in the control room.

current_heading: "Current position"   # the experience item with current: true

# Each item's `points` are the CV PDF's bullet points, one paragraph each.
experience:
  heading: "Research and professional experience"
  items:
    - id: postdoc
      current: true
      title: "{role}"                       # profile.role
      org: "{affiliations_units}"           # from profile.affiliations
      place: "Leuven & Genk, Belgium"
      start: "2026-10"
      end: null
      period: "Oct 2026 – present"
      points:
        - "Leading research on stochastic optimization for power system operation, planning, and markets."
    - id: phd
      title: "Ph.D. Researcher"
      org: "KU Leuven and Etch by EnergyVille"
      place: "Leuven & Genk, Belgium"
      start: "2022"
      end: "2026-10"
      period: "2022 – Oct 2026"
      points:
        - "Developed stochastic optimization frameworks for risk-based congestion management in hybrid AC/DC grids."
        - "Modeled redispatch, transmission switching and power flow control as remedial actions under continuous non-Gaussian forecast uncertainty from wind and solar."
        - "Quantified how controllable HVDC links reduce congestion management costs and balancing risks."
        - "Contributed to multi-partner R&D projects linking academic models with operational planning."
        - "Supervised three master’s theses to successful completion."
    - id: entegro
      title: "R&D Engineer (full-time, alongside the M.Sc.)"
      org: "Entegro Energy Systems"
      place: "Germany & Turkey"
      start: "2019"
      end: "2022"
      period: "2019–2022"
      points:
        - "Developed data-driven algorithms that raise fault alarms for the maintenance team and set cleaning schedules across the company’s PV plant portfolio."
        - "Co-developed the portal that monitors the whole portfolio in two countries; the algorithms run on a dedicated server for all monitored plants and handle many inverter types and data formats."
        - "In the TÜBİTAK-funded project “Solar Power Plants Monitoring and Fault Diagnosis” (2020–2021), developed sensorless methods that detect faults even under cloudy conditions and quantify soiling losses from inverter data only."
        - "Designed PV system projects up to multi-MW scale, carried out the tests and reports required before construction, and prepared monitoring reports for plants in operation."

