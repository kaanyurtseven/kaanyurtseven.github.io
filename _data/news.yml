# ============================================================
# News: chronological professional log
# ============================================================
# Fields:
#   id          stable slug, used as the anchor /news/#<id> and by map pins (news:)
#   date        "YYYY-MM" or "YYYY-MM-DD". Sorted as a string, so give entries in the
#               same month a day-precise date when their order matters.
#   status      held (default) | scheduled. Only held entries are shown; set an
#               entry to held after the event.
#   category    milestone | award | publication | conference | talk | policy |
#               visit | training | media
#   title       Short, specific headline (no place; use `place`)
#   place       "City, Country" or "Online" (optional)
#   body        One or two sentences, first person.
#   link        Primary URL (optional), with link_label (optional)
#   links       Extra links: [{label, url}] (optional)
#   images      [{src, width, height, alt}] (optional); the first is shown
#   credit      Photo credit, e.g. "Photo by DCforEU" (optional)
#   pub         Publication key from publications.yml, e.g. C8 (optional)
#   pin         Map pin id from map_pins.yml (optional)
# ============================================================

- id: phd-defence-2026
  date: "2026-10-15"
  category: milestone
  title: "PhD defended at KU Leuven"
  place: "Leuven, Belgium"
  body: >
    I publicly defended my doctoral thesis, “Risk-based Congestion Management Under Non-Gaussian
    Uncertainty in Hybrid AC/DC Grids”, supervised by Prof. Dirk Van Hertem and Prof. Hakan Ergun.
    I continue at KU Leuven and Etch by EnergyVille as a postdoctoral researcher.
  link: "https://www.linkedin.com/feed/update/urn:li:activity:7517886797356351488/"
  link_label: "LinkedIn post"
  links:
    - label: "Thesis record"
      url: "https://lirias.kuleuven.be/handle/20.500.12942/795495"
  images:
    - src: "/assets/images/phd-defence-2026.jpg"
      width: 1600
      height: 1200
      alt: "Kaan presenting at the public PhD defense, a slide on balancing-aware congestion management on the screen"
  pub: T2
  pin: home
  banner: true

