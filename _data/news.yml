- id: etch-workshop-2026
  date: "2026-10-06"
  category: talk
  title: "Talk at the Third Annual Belgian Energy Transition Workshop"
  place: "Genk, Belgium"
  body: >
    Presented “Risk-Based Congestion Management Under Non-Gaussian Uncertainty in Hybrid AC/DC Grids”
    in the uncertainty session of Etch’s workshop “Shaping the Future Grid”, on how HVDC flexibility and
    topology reconfiguration can reduce reliance on redispatch and RES curtailment and what that asks
    of optimization tools.
  link: "https://etch.be/en/third-annual-belgian-energy-transition-workshop-shaping-future-grid"
  link_label: "Workshop program"
