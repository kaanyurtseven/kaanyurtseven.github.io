# No-wrap rules for visible text, longest "from" first: each "to" is a no-wrap span, or the
# words with a word joiner (U+2060) after each hyphen.
# _includes/nowrap.html replaces each "from" in the text between tags by a token, then each token by its "to"
# (two passes, so a shorter row never matches inside a longer one: "6 October 2026" in "26 October 2026").
# A new compound (letters-letters), "d Month yyyy" date, "yyyy–yyyy" range or listed name in visible text needs
# a row here; scripts/check_typography.rb lists the missing ones.
token: ["\uE000", "\uE001"]
months: [January, February, March, April, May, June, July, August, September, October, November, December]
months_abbr: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Oct, Nov, Dec]
