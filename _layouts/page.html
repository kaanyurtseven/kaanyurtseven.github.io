---
layout: default
---

<main class="site-main" id="main-content">
  <div class="container container--narrow">
    <header class="page-header">
      <h1 class="page-header__title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-header__subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </header>
    <div class="prose">
      {{ content }}
    </div>
  </div>
</main>
